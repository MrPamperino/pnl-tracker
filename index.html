<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PnL</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f2f2f2;
    --muted: #888;
    --line: #222;
    --up: #3dd68c;
    --down: #ff6b6b;
    --card: #121212;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 40px 20px 80px;
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 {
    font-size: 13px; font-weight: 500; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 16px;
  }
  .hero {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 32px;
  }
  @media (max-width: 760px) { .hero { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .hero { grid-template-columns: 1fr; } }
  .closed-wrap { margin: -16px 0 28px; }
  .closed-toggle { background: none; border: none; padding: 2px 0; color: var(--muted); font-size: 12px; cursor: pointer; }
  .closed-toggle:hover { color: var(--fg); }
  .closed-toggle .chev { display: inline-block; font-size: 10px; transition: transform .15s; }
  body.show-closed .closed-toggle .chev { transform: rotate(90deg); }
  body:not(.show-closed) #realizedRows { display: none; }
  .realized { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .realized div { padding: 3px 0; }
  .realized b { color: var(--fg); font-weight: 560; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px;
  }
  .card .lbl {
    color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .card .val {
    font-size: 26px; font-weight: 560; letter-spacing: -0.03em;
  }
  .card .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 12px; font-weight: 500; color: var(--muted);
    padding: 0 8px 10px; border-bottom: 1px solid var(--line);
  }
  th.r, td.r { text-align: right; }
  td {
    padding: 14px 8px; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .name { font-weight: 560; }
  .venue { color: var(--muted); font-size: 12px; margin-top: 2px; }
  input {
    width: 96px; background: transparent; border: 1px solid transparent;
    color: inherit; font: inherit; text-align: right; padding: 2px 4px;
    border-radius: 4px;
  }
  input:hover, input:focus { border-color: #333; outline: none; }
  .foot {
    margin-top: 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    color: var(--muted); font-size: 12px;
  }
  button {
    background: transparent; border: 1px solid #333; color: var(--fg);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 12px;
    cursor: pointer;
  }
  button:hover { border-color: #555; }
  .upnl-card { cursor: pointer; user-select: none; }
  .upnl-card:hover { border-color: #333; }
  .upnl-card .chev { transition: transform .15s; margin-left: 2px; }
  body.show-upnl .upnl-card .chev { transform: rotate(90deg); }
  body:not(.show-upnl) .upnl-body,
  body:not(.show-upnl) .upnl-only,
  body:not(.show-upnl) .upnl-col { display: none; }
  body.show-upnl .upnl-hidden { display: none; }
  tr.pos { cursor: pointer; }
  tr.pos:hover td { background: #0f0f0f; }
  .chev { display: inline-block; color: var(--muted); font-size: 10px; width: 12px; transition: transform .15s; }
  tr.pos.open .chev { transform: rotate(90deg); }
  tr.pos.open td { border-bottom-color: transparent; }
  tr.detail td { padding: 0 8px 14px 20px; font-size: 12px; color: var(--muted); }
  .lb { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px;
        background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .lb .k { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
  .lb .v { color: var(--fg); font-variant-numeric: tabular-nums; word-break: break-all; }
  .lb .full { grid-column: 1 / -1; }
  .lb a { color: #9ecbff; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Portfolio</h1>
  <div style="margin:-8px 0 18px;font-size:13px"><a href="./wallet-5mef.html" style="color:#9ecbff;text-decoration:none">Wallet 5Mef…849r →</a> · <a href="./big-positions.html" style="color:#9ecbff;text-decoration:none">Big positions →</a></div>
  <div class="hero">
    <div class="card upnl-card" onclick="toggleUpnl()" role="button" tabindex="0" title="Show / hide unrealized PnL">
      <div class="lbl">Unrealized PnL <span class="chev">▶</span></div>
      <div class="upnl-body">
        <div class="val" id="pnl">—</div>
        <div class="hint" id="pnlPct"></div>
      </div>
      <div class="upnl-hidden">
        <div class="val" style="color:var(--muted)">••••</div>
        <div class="hint">tap to show</div>
      </div>
    </div>
    <div class="card">
      <div class="lbl">Portfolio</div>
      <div class="val" id="value">—</div>
      <div class="hint">mark value</div>
    </div>
    <div class="card">
      <div class="lbl">Cost</div>
      <div class="val" id="cost">—</div>
      <div class="hint">cost basis</div>
    </div>
    <div class="card">
      <div class="lbl">Realized PnL</div>
      <div class="val" id="realized">—</div>
      <div class="hint upnl-only" id="combined"></div>
    </div>
  </div>
  <div class="closed-wrap">
    <button class="closed-toggle" onclick="toggleClosed()" aria-controls="realizedRows">Closed positions <span class="chev">▶</span> (<span id="closedCount">0</span>)</button>
    <div class="realized" id="realizedRows"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Asset</th>
        <th class="r">Size</th>
        <th class="r">Avg</th>
        <th class="r">Mark</th>
        <th class="r">Value</th>
        <th class="r upnl-col">PnL</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="foot">
    <button onclick="refresh()">Refresh marks</button>
    <button onclick="reset()">Reset</button>
    <span id="asof"></span>
  </div>
</div>

<script>
// Holdings, cost basis, last buys and closed positions live in portfolio.json
// (fetched fresh on every load / refresh). It is the single source of truth.
let SEED = null;      // { eurusd, positions: [...] }
let REALIZED = [];    // closed positions; append new closes in portfolio.json

const KEY = "pnl-usd-v15";
const DATA_KEY = "pnl-portfolio-data";
const UPNL_KEY = "pnl-show-upnl";
const CLOSED_KEY = "pnl-show-closed";
function applyClosed() {
  const on = localStorage.getItem(CLOSED_KEY) === "1";
  document.body.classList.toggle("show-closed", on);
  document.querySelector(".closed-toggle")?.setAttribute("aria-expanded", on ? "true" : "false");
}
function toggleClosed() {
  localStorage.setItem(CLOSED_KEY, document.body.classList.contains("show-closed") ? "0" : "1");
  applyClosed();
}
function applyUpnl() {
  document.body.classList.toggle("show-upnl", localStorage.getItem(UPNL_KEY) === "1");
  document.querySelectorAll("tr.detail td").forEach(td => td.colSpan = document.body.classList.contains("show-upnl") ? 6 : 5);
}
function toggleUpnl() {
  localStorage.setItem(UPNL_KEY, document.body.classList.contains("show-upnl") ? "0" : "1");
  applyUpnl();
}
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("upnl-card")) { e.preventDefault(); toggleUpnl(); }
});
let state = null;

async function loadData() {
  try {
    const r = await fetch("portfolio.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    localStorage.setItem(DATA_KEY, JSON.stringify(d));
    applyData(d);
    return true;
  } catch (e) {
    console.warn("portfolio.json fetch failed, using last saved copy", e);
    try { const c = localStorage.getItem(DATA_KEY); if (c) { applyData(JSON.parse(c)); return true; } } catch {}
    return !!SEED;
  }
}
function applyData(d) {
  SEED = { eurusd: d.eurusd, positions: d.positions };
  REALIZED = d.realized || [];
}
// Sizes / cost / last buys always come from portfolio.json; only live marks are kept
// from the browser (current key or any older pnl-usd-v* key), so an old cached
// state can never show stale holdings.
function cachedMarks() {
  const marks = {};
  const keys = Object.keys(localStorage).filter(k => /^pnl-usd-v\d+$/.test(k))
    .sort((a, b) => Number(a.split("-v")[1]) - Number(b.split("-v")[1]));
  for (const k of keys) {
    try { for (const p of JSON.parse(localStorage.getItem(k)).positions || []) if (p.mark > 0) marks[p.id] = p.mark; } catch {}
  }
  for (const k of keys) if (k !== KEY) localStorage.removeItem(k);   // tidy old versions
  return marks;
}
function mergeState(marks) {
  const s = structuredClone(SEED);
  for (const p of s.positions) if (Number.isFinite(marks[p.id]) && marks[p.id] > 0) p.mark = marks[p.id];
  return s;
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function money(n, d = 2) {
  if (n == null || Number.isNaN(n)) return "—";
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString("en-US", {
    minimumFractionDigits: d,
    maximumFractionDigits: d,
  });
  return (neg ? "−" : "") + "$" + s;
}
function qty(n) {
  return n.toLocaleString("en-US", {
    maximumFractionDigits: n >= 1e6 ? 2 : n >= 1000 ? 3 : 4,
  });
}
function cls(n) {
  return n > 0 ? "up" : n < 0 ? "down" : "";
}

function render() {
  let totVal = 0, totCost = 0, totPnl = 0;
  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";

  for (const p of state.positions) {
    const cost = p.holdings * p.avg;
    const value = p.holdings * p.mark;
    const pnl = value - cost;
    const pct = cost ? (pnl / cost) * 100 : 0;
    totVal += value; totCost += cost; totPnl += pnl;

    const isOpen = openRows.has(p.id);
    const tr = document.createElement("tr");
    tr.className = "pos" + (isOpen ? " open" : "");
    tr.dataset.id = p.id;
    tr.innerHTML = `
      <td>
        <div class="name"><span class="chev">▶</span>${p.symbol}</div>
        <div class="venue">${p.venue}</div>
      </td>
      <td class="r">${qty(p.holdings)}</td>
      <td class="r"><input data-id="${p.id}" data-f="avg" value="${p.avg}" /></td>
      <td class="r"><input data-id="${p.id}" data-f="mark" value="${p.mark}" /></td>
      <td class="r">${money(value)}</td>
      <td class="r upnl-col ${cls(pnl)}">${money(pnl)} <span style="opacity:.65">(${pct.toFixed(1)}%)</span></td>
    `;
    tbody.appendChild(tr);
    const dr = document.createElement("tr");
    dr.className = "detail";
    dr.hidden = !isOpen;
    dr.innerHTML = `<td colspan="6">${lastBuyHtml(p)}</td>`;
    tbody.appendChild(dr);
    tr.addEventListener("click", e => {
      if (e.target.closest("input")) return;
      if (openRows.has(p.id)) openRows.delete(p.id); else openRows.add(p.id);
      tr.classList.toggle("open");
      dr.hidden = !dr.hidden;
    });
  }

  tbody.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("change", () => {
      const p = state.positions.find(x => x.id === inp.dataset.id);
      const n = Number(String(inp.value).replace(/,/g, ""));
      if (!Number.isFinite(n)) return;
      p[inp.dataset.f] = n;
      save();
      render();
    });
  });

  const pnlEl = document.getElementById("pnl");
  pnlEl.textContent = money(totPnl);
  pnlEl.className = "val " + cls(totPnl);
  document.getElementById("pnlPct").textContent =
    (totCost ? ((totPnl / totCost) * 100).toFixed(1) : "0") + "% vs cost";
  document.getElementById("value").textContent = money(totVal);
  document.getElementById("cost").textContent = money(totCost);
  let rTot = 0;
  const rRows = REALIZED.map(r => {
    const pnl = r.proceeds - r.cost;
    rTot += pnl;
    const sign = pnl >= 0 ? "+" : "";
    return `<div><b>${r.symbol}</b> · closed ${r.closed} · ${qty(r.qty)} sold for ${money(r.proceeds)} ${r.quote} · ` +
      `cost ${money(r.cost)} (avg ${money(r.cost / r.qty, 4)} → sell ${money(r.proceeds / r.qty, 4)}) · ` +
      `<span class="${cls(pnl)}">${sign}${money(pnl)} (${sign}${((pnl / r.cost) * 100).toFixed(1)}%)</span></div>`;
  });
  document.getElementById("realizedRows").innerHTML = rRows.join("");
  document.getElementById("closedCount").textContent = REALIZED.length;
  applyClosed();
  const rEl = document.getElementById("realized");
  rEl.textContent = (rTot >= 0 ? "+" : "") + money(rTot);
  rEl.className = "val " + cls(rTot);
  const comb = totPnl + rTot;
  document.getElementById("combined").textContent =
    "total incl. unrealized: " + (comb >= 0 ? "+" : "") + money(comb);

  document.getElementById("asof").textContent =
    "USD · " + new Date().toLocaleString();
  applyUpnl();
}

const openRows = new Set();
function short(a) { return a && a.length > 12 ? a.slice(0, 6) + "…" + a.slice(-4) : a; }
function lastBuyHtml(p) {
  const seed = SEED.positions.find(x => x.id === p.id) || {};
  const lb = p.lastBuy !== undefined ? p.lastBuy : seed.lastBuy;
  const cell = (k, v, full) => `<div${full ? ' class="full"' : ""}><div class="k">${k}</div><div class="v">${v}</div></div>`;
  if (!lb) {
    const note = p.lastBuyNote || seed.lastBuyNote || "";
    return `<div class="lb">${cell("Last buy", "Last buy not recorded", true)}` +
      (note ? cell("On file", note, true) : "") +
      cell("Avg buy", money(p.avg, 4)) + cell("Current", money(p.mark, 4)) + `</div>`;
  }
  const chg = lb.price ? ((p.mark - lb.price) / lb.price) * 100 : 0;
  const ref = lb.tx
    ? `<a href="${lb.explorer}${lb.tx}" target="_blank" rel="noopener">${short(lb.tx)} ↗</a>`
    : lb.orderId ? `order ${lb.orderId}` : "—";
  return `<div class="lb">` +
    cell("Last buy", lb.time) +
    cell("Quantity", qty(lb.qty) + " " + p.symbol) +
    cell("Price", money(lb.price, lb.price < 1 ? 5 : 2)) +
    cell("Paid", Number(lb.paid).toLocaleString("en-US", { maximumFractionDigits: 2 }) + " " + lb.paidToken) +
    cell("Chain", lb.chain) +
    cell("Wallet", lb.wallet ? short(lb.wallet) : "—") +
    cell(lb.tx ? "Tx" : "Ref", ref) +
    (lb.note ? cell("Note", lb.note) : "") +
    cell("Vs last buy",
      `avg ${money(p.avg, 4)} vs last ${money(lb.price, 4)} · now ${money(p.mark, 4)} ` +
      `<span class="${cls(chg)}">(${chg >= 0 ? "+" : ""}${chg.toFixed(1)}% since last buy)</span>`, true) +
    `</div>`;
}

function reset() {
  state = mergeState({});
  save();
  render();
}

let lastRefresh = 0;
async function refresh() {
  lastRefresh = Date.now();
  await loadData();
  if (!SEED) return;
  const marks = {};
  for (const p of (state?.positions || [])) marks[p.id] = p.mark;
  state = mergeState(state ? marks : cachedMarks());
  render();
  try {
    const SFI = "0xb753428af26E81097e7fD17f40c88aaA3E04902c";
    const AERO = "0x940181a94A35A4569E4529A3CDfB74e38FD98631";
    const [zecSpot, kr, aeroSpot, dsSfi] = await Promise.all([
      fetch("https://api.coinbase.com/v2/prices/ZEC-USD/spot").then(r => r.json()).catch(() => null),
      fetch("https://api.kraken.com/0/public/Ticker?pair=DRVUSD").then(r => r.json()).catch(() => null),
      fetch("https://api.coinbase.com/v2/prices/AERO-USD/spot").then(r => r.json()).catch(() => null),
      fetch("https://api.dexscreener.com/latest/dex/tokens/" + SFI).then(r => r.json()).catch(() => null),
    ]);
    let zcat = null;
    try {
      const zj = await fetch("https://lite-api.jup.ag/tokens/v2/search?query=HcRLc9VDgjLeK154xDawfb1dmVJ98DoSqcwTHGqiDeJR").then(r => r.json());
      zcat = (zj || []).find(t => t.id === "HcRLc9VDgjLeK154xDawfb1dmVJ98DoSqcwTHGqiDeJR")?.usdPrice;
    } catch {}
    const zec = Number(zecSpot?.data?.amount);
    const drv = Number(kr?.result?.DRVUSD?.c?.[0]);
    let aero = Number(aeroSpot?.data?.amount);
    if (!aero) {
      try {
        const da = await fetch("https://api.dexscreener.com/latest/dex/tokens/" + AERO).then(r => r.json());
        aero = Number((da?.pairs || []).find(x => x.chainId === "base" && x.baseToken?.address === AERO)?.priceUsd);
      } catch {}
    }
    const sfi = Number((dsSfi?.pairs || [])[0]?.priceUsd);
    // Coins without a DEX pair (e.g. QTC): CoinGecko by p.cgId → DefiLlama coingecko:<id> → stored mark from portfolio.json
    const cg = {};
    const cgIds = [...new Set(state.positions.map(p => p.cgId).filter(Boolean))];
    if (cgIds.length) {
      try {
        const j = await fetch("https://api.coingecko.com/api/v3/simple/price?vs_currencies=usd&ids=" + cgIds.join(",")).then(r => r.json());
        for (const id of cgIds) if (Number(j?.[id]?.usd) > 0) cg[id] = Number(j[id].usd);
      } catch {}
      const miss = cgIds.filter(id => !cg[id]);
      if (miss.length) {
        try {
          const j = await fetch("https://coins.llama.fi/prices/current/" + miss.map(id => "coingecko:" + id).join(",")).then(r => r.json());
          for (const id of miss) if (Number(j?.coins?.["coingecko:" + id]?.price) > 0) cg[id] = Number(j.coins["coingecko:" + id].price);
        } catch {}
      }
    }
    for (const p of state.positions) {
      if (p.cgId && cg[p.cgId]) p.mark = cg[p.cgId];
      if (p.id === "zec" && zec) p.mark = zec;
      if (p.id === "zcat" && zcat) p.mark = zcat;
      if (p.id === "drv" && drv) p.mark = drv;
      if (p.id === "aero" && aero) p.mark = aero;
      if (p.id === "sfi" && sfi) p.mark = sfi;
    }
    save();
  } catch (e) {
    console.warn(e);
  }
  render();
}

// Re-pull data + marks when a long-open tab comes back to the foreground.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - lastRefresh > 60000) refresh();
});
refresh();
</script>
</body>
</html>
