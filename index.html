<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PnL</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f2f2f2;
    --muted: #888;
    --line: #222;
    --up: #3dd68c;
    --down: #ff6b6b;
    --card: #121212;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 40px 20px 80px;
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 {
    font-size: 13px; font-weight: 500; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 16px;
  }
  .hero {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 32px;
  }
  @media (max-width: 760px) { .hero { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .hero { grid-template-columns: 1fr; } }
  .realized { margin: -16px 0 28px; font-size: 12px; color: var(--muted); }
  .realized div { padding: 3px 0; }
  .realized b { color: var(--fg); font-weight: 560; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px;
  }
  .card .lbl {
    color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .card .val {
    font-size: 26px; font-weight: 560; letter-spacing: -0.03em;
  }
  .card .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 12px; font-weight: 500; color: var(--muted);
    padding: 0 8px 10px; border-bottom: 1px solid var(--line);
  }
  th.r, td.r { text-align: right; }
  td {
    padding: 14px 8px; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .name { font-weight: 560; }
  .venue { color: var(--muted); font-size: 12px; margin-top: 2px; }
  input {
    width: 96px; background: transparent; border: 1px solid transparent;
    color: inherit; font: inherit; text-align: right; padding: 2px 4px;
    border-radius: 4px;
  }
  input:hover, input:focus { border-color: #333; outline: none; }
  .foot {
    margin-top: 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    color: var(--muted); font-size: 12px;
  }
  button {
    background: transparent; border: 1px solid #333; color: var(--fg);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 12px;
    cursor: pointer;
  }
  button:hover { border-color: #555; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Portfolio</h1>
  <div style="margin:-8px 0 18px;font-size:13px"><a href="./wallet-5mef.html" style="color:#9ecbff;text-decoration:none">Wallet 5Mef…849r →</a></div>
  <div class="hero">
    <div class="card">
      <div class="lbl">Total PnL</div>
      <div class="val" id="pnl">—</div>
      <div class="hint" id="pnlPct"></div>
    </div>
    <div class="card">
      <div class="lbl">Portfolio</div>
      <div class="val" id="value">—</div>
      <div class="hint">mark value</div>
    </div>
    <div class="card">
      <div class="lbl">Cost</div>
      <div class="val" id="cost">—</div>
      <div class="hint">cost basis</div>
    </div>
    <div class="card">
      <div class="lbl">Realized PnL</div>
      <div class="val" id="realized">—</div>
      <div class="hint" id="combined"></div>
    </div>
  </div>
  <div class="realized" id="realizedRows"></div>

  <table>
    <thead>
      <tr>
        <th>Asset</th>
        <th class="r">Size</th>
        <th class="r">Avg</th>
        <th class="r">Mark</th>
        <th class="r">Value</th>
        <th class="r">PnL</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="foot">
    <button onclick="refresh()">Refresh marks</button>
    <button onclick="reset()">Reset</button>
    <span id="asof"></span>
  </div>
</div>

<script>
const SEED = {
  eurusd: 1.1614,
  positions: [
    {
      id: "drv",
      symbol: "DRV",
      venue: "spot + Base · 0x7E3d…c869",
      holdings: 166737.26215751874, // 143,517.106 spot + 23,220.156158 Base (bought 2026-09-26)
      avg: 0.19345138358749123, // $32,255.55 cost = $22,268.55 (143,517.106 @ €0.1336×1.1614) + $9,987.00 USDC
      mark: 0.42941,
    },
    {
      id: "zec",
      symbol: "ZEC",
      venue: "exchange",
      holdings: 85.1323656,
      avg: 1171.44276512,
      mark: 1557.86,
    },
    {
      id: "zcat",
      symbol: "ZCAT",
      venue: "Solana · 5cN5…ZkrG",
      holdings: 1240843.570063622,
      avg: 0.04420703207790289,
      mark: 0.05903274058068413,
    },
    {
      id: "sfi",
      symbol: "SFI",
      venue: "manual · 90 @ 10k USDC",
      holdings: 90,
      avg: 111.11111111111111,
      mark: 115.78,
    },
    {
      id: "aero",
      symbol: "AERO",
      venue: "Base · 0x9F0d…D2B0",
      holdings: 34708.798064140174,
      avg: 0.7828378460927585, // 27,171.360717 USDC / 34,708.798064 AERO
      mark: 0.849485,
    },
    // DRV added 2026-09-26 09:45 PT on Base (tx 0x237c178c…d49419a1) from 0x7E3d…c869:
    // 23,220.156158 DRV for 9,987.003601 USDC @ ~$0.43010 via 0x Settler.
    // AI closed 2026-09-25 20:04 PT: sold all 250,663.224927 AI from Robinhood EOA 0x7E3d…c869
    // (tx 0x7cc5fa5a…b188a1) for 60,622.008648 USDG @ ~$0.24185.
    // Cost $58,527.85 @ ~$0.23349 → realized +$2,094.16 (+3.58%).
    // AERO bought 2026-09-25 13:45 PT on Base (tx 0x18c95ac8…db415f):
    // 34,708.798064 AERO for 27,171.360717 USDC @ ~$0.78283.
    // JUP closed 2026-09-18: unlocked vote escrow 2DPkr…kVZ5 (tx 5PCzdFoH…mekB),
    // then sold 47,317.256018 JUP via Jupiter RouteV2 (tx D7yJvKz5…dgZMk)
    // for 12,133.867468 USDC net (+12.146013 USDC aggregator fee).
    // Cost $10,000.005 @ ~$0.2113 → realized +$2,133.86 (+21.3%).
  ],
};

// Closed positions (realized PnL). Append new closes here.
const REALIZED = [
  {
    symbol: "JUP", venue: "Solana", closed: "2026-09-18",
    qty: 47317.256018, cost: 10000.005, proceeds: 12133.867468, quote: "USDC",
  },
  {
    symbol: "AI", venue: "Robinhood Chain · Artificial Inu", closed: "2026-09-25",
    qty: 250663.224927, cost: 58527.85, proceeds: 60622.008648, quote: "USDG",
  },
];

const KEY = "pnl-usd-v9";
let state = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return structuredClone(SEED);
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function money(n, d = 2) {
  if (n == null || Number.isNaN(n)) return "—";
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString("en-US", {
    minimumFractionDigits: d,
    maximumFractionDigits: d,
  });
  return (neg ? "−" : "") + "$" + s;
}
function qty(n) {
  return n.toLocaleString("en-US", {
    maximumFractionDigits: n >= 1000 ? 2 : 4,
  });
}
function cls(n) {
  return n > 0 ? "up" : n < 0 ? "down" : "";
}

function render() {
  let totVal = 0, totCost = 0, totPnl = 0;
  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";

  for (const p of state.positions) {
    const cost = p.holdings * p.avg;
    const value = p.holdings * p.mark;
    const pnl = value - cost;
    const pct = cost ? (pnl / cost) * 100 : 0;
    totVal += value; totCost += cost; totPnl += pnl;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        <div class="name">${p.symbol}</div>
        <div class="venue">${p.venue}</div>
      </td>
      <td class="r">${qty(p.holdings)}</td>
      <td class="r"><input data-id="${p.id}" data-f="avg" value="${p.avg}" /></td>
      <td class="r"><input data-id="${p.id}" data-f="mark" value="${p.mark}" /></td>
      <td class="r">${money(value)}</td>
      <td class="r ${cls(pnl)}">${money(pnl)} <span style="opacity:.65">(${pct.toFixed(1)}%)</span></td>
    `;
    tbody.appendChild(tr);
  }

  tbody.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("change", () => {
      const p = state.positions.find(x => x.id === inp.dataset.id);
      const n = Number(String(inp.value).replace(/,/g, ""));
      if (!Number.isFinite(n)) return;
      p[inp.dataset.f] = n;
      save();
      render();
    });
  });

  const pnlEl = document.getElementById("pnl");
  pnlEl.textContent = money(totPnl);
  pnlEl.className = "val " + cls(totPnl);
  document.getElementById("pnlPct").textContent =
    (totCost ? ((totPnl / totCost) * 100).toFixed(1) : "0") + "% vs cost";
  document.getElementById("value").textContent = money(totVal);
  document.getElementById("cost").textContent = money(totCost);
  let rTot = 0;
  const rRows = REALIZED.map(r => {
    const pnl = r.proceeds - r.cost;
    rTot += pnl;
    const sign = pnl >= 0 ? "+" : "";
    return `<div><b>${r.symbol}</b> · closed ${r.closed} · ${qty(r.qty)} sold for ${money(r.proceeds)} ${r.quote} · ` +
      `cost ${money(r.cost)} (avg ${money(r.cost / r.qty, 4)} → sell ${money(r.proceeds / r.qty, 4)}) · ` +
      `<span class="${cls(pnl)}">${sign}${money(pnl)} (${sign}${((pnl / r.cost) * 100).toFixed(1)}%)</span></div>`;
  });
  document.getElementById("realizedRows").innerHTML = rRows.join("");
  const rEl = document.getElementById("realized");
  rEl.textContent = (rTot >= 0 ? "+" : "") + money(rTot);
  rEl.className = "val " + cls(rTot);
  const comb = totPnl + rTot;
  document.getElementById("combined").textContent =
    "total incl. unrealized: " + (comb >= 0 ? "+" : "") + money(comb);

  document.getElementById("asof").textContent =
    "USD · " + new Date().toLocaleString();
}

function reset() {
  state = structuredClone(SEED);
  save();
  render();
}

async function refresh() {
  try {
    const SFI = "0xb753428af26E81097e7fD17f40c88aaA3E04902c";
    const AERO = "0x940181a94A35A4569E4529A3CDfB74e38FD98631";
    const [zecSpot, kr, aeroSpot, dsSfi] = await Promise.all([
      fetch("https://api.coinbase.com/v2/prices/ZEC-USD/spot").then(r => r.json()),
      fetch("https://api.kraken.com/0/public/Ticker?pair=DRVUSD").then(r => r.json()),
      fetch("https://api.coinbase.com/v2/prices/AERO-USD/spot").then(r => r.json()).catch(() => null),
      fetch("https://api.dexscreener.com/latest/dex/tokens/" + SFI).then(r => r.json()),
    ]);
    let zcat = null;
    try {
      const zj = await fetch("https://lite-api.jup.ag/tokens/v2/search?query=HcRLc9VDgjLeK154xDawfb1dmVJ98DoSqcwTHGqiDeJR").then(r => r.json());
      zcat = (zj || []).find(t => t.id === "HcRLc9VDgjLeK154xDawfb1dmVJ98DoSqcwTHGqiDeJR")?.usdPrice;
    } catch {}
    const zec = Number(zecSpot?.data?.amount);
    const drv = Number(kr?.result?.DRVUSD?.c?.[0]);
    let aero = Number(aeroSpot?.data?.amount);
    if (!aero) {
      try {
        const da = await fetch("https://api.dexscreener.com/latest/dex/tokens/" + AERO).then(r => r.json());
        aero = Number((da?.pairs || []).find(x => x.chainId === "base" && x.baseToken?.address === AERO)?.priceUsd);
      } catch {}
    }
    const sfi = Number((dsSfi?.pairs || [])[0]?.priceUsd);
    for (const p of state.positions) {
      if (p.id === "zec" && zec) p.mark = zec;
      if (p.id === "zcat" && zcat) p.mark = zcat;
      if (p.id === "drv" && drv) p.mark = drv;
      if (p.id === "aero" && aero) p.mark = aero;
      if (p.id === "sfi" && sfi) p.mark = sfi;
    }
    save();
  } catch (e) {
    console.warn(e);
  }
  render();
}

refresh();
</script>
</body>
</html>
