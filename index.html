<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PnL</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f2f2f2;
    --muted: #888;
    --line: #222;
    --up: #3dd68c;
    --down: #ff6b6b;
    --card: #121212;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 40px 20px 80px;
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 {
    font-size: 13px; font-weight: 500; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 16px;
  }
  .hero {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 32px;
  }
  @media (max-width: 640px) { .hero { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px;
  }
  .card .lbl {
    color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .card .val {
    font-size: 26px; font-weight: 560; letter-spacing: -0.03em;
  }
  .card .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 12px; font-weight: 500; color: var(--muted);
    padding: 0 8px 10px; border-bottom: 1px solid var(--line);
  }
  th.r, td.r { text-align: right; }
  td {
    padding: 14px 8px; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .name { font-weight: 560; }
  .venue { color: var(--muted); font-size: 12px; margin-top: 2px; }
  input {
    width: 96px; background: transparent; border: 1px solid transparent;
    color: inherit; font: inherit; text-align: right; padding: 2px 4px;
    border-radius: 4px;
  }
  input:hover, input:focus { border-color: #333; outline: none; }
  .foot {
    margin-top: 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    color: var(--muted); font-size: 12px;
  }
  button {
    background: transparent; border: 1px solid #333; color: var(--fg);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 12px;
    cursor: pointer;
  }
  button:hover { border-color: #555; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Portfolio</h1>
  <div style="margin:-8px 0 18px;font-size:13px"><a href="./wallet-5mef.html" style="color:#9ecbff;text-decoration:none">Wallet 5Mef…849r →</a></div>
  <div class="hero">
    <div class="card">
      <div class="lbl">Total PnL</div>
      <div class="val" id="pnl">—</div>
      <div class="hint" id="pnlPct"></div>
    </div>
    <div class="card">
      <div class="lbl">Portfolio</div>
      <div class="val" id="value">—</div>
      <div class="hint">mark value</div>
    </div>
    <div class="card">
      <div class="lbl">Cost</div>
      <div class="val" id="cost">—</div>
      <div class="hint">cost basis</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Asset</th>
        <th class="r">Size</th>
        <th class="r">Avg</th>
        <th class="r">Mark</th>
        <th class="r">Value</th>
        <th class="r">PnL</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="foot">
    <button onclick="refresh()">Refresh marks</button>
    <button onclick="reset()">Reset</button>
    <span id="asof"></span>
  </div>
</div>

<script>
const SEED = {
  eurusd: 1.1614,
  positions: [
    {
      id: "drv",
      symbol: "DRV",
      venue: "spot",
      holdings: 143517.106,
      avg: 0.1336 * 1.1614,
      mark: 0.14649,
    },
    {
      id: "zec",
      symbol: "ZEC",
      venue: "exchange",
      holdings: 85.1323656,
      avg: 1171.44276512,
      mark: 1164.175,
    },
    {
      id: "zcat",
      symbol: "ZCAT",
      venue: "Solana · 5cN5…ZkrG",
      holdings: 1240843.570063622,
      avg: 0.04420703207790289,
      mark: 0.09226858435437232,
    },
    {
      id: "ai",
      symbol: "AI",
      venue: "Robinhood · 0x7E3d…c869",
      holdings: 250663.2249268438,
      avg: 0.2334919495813812,
      mark: 0.272,
    },
    {
      id: "sfi",
      symbol: "SFI",
      venue: "manual · 90 @ 10k USDC",
      holdings: 90,
      avg: 111.11111111111111,
      mark: 133.58,
    },
    {
      id: "jup",
      symbol: "JUP",
      venue: "locked · Ay1v…nMFi",
      holdings: 47317.256018,
      avg: 0.21133949517689463,
      mark: 0.24265718316774845,
    },
  ],
};

const KEY = "pnl-usd-v6";
let state = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return structuredClone(SEED);
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function money(n, d = 2) {
  if (n == null || Number.isNaN(n)) return "—";
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString("en-US", {
    minimumFractionDigits: d,
    maximumFractionDigits: d,
  });
  return (neg ? "−" : "") + "$" + s;
}
function qty(n) {
  return n.toLocaleString("en-US", {
    maximumFractionDigits: n >= 1000 ? 2 : 4,
  });
}
function cls(n) {
  return n > 0 ? "up" : n < 0 ? "down" : "";
}

function render() {
  let totVal = 0, totCost = 0, totPnl = 0;
  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";

  for (const p of state.positions) {
    const cost = p.holdings * p.avg;
    const value = p.holdings * p.mark;
    const pnl = value - cost;
    const pct = cost ? (pnl / cost) * 100 : 0;
    totVal += value; totCost += cost; totPnl += pnl;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        <div class="name">${p.symbol}</div>
        <div class="venue">${p.venue}</div>
      </td>
      <td class="r">${qty(p.holdings)}</td>
      <td class="r"><input data-id="${p.id}" data-f="avg" value="${p.avg}" /></td>
      <td class="r"><input data-id="${p.id}" data-f="mark" value="${p.mark}" /></td>
      <td class="r">${money(value)}</td>
      <td class="r ${cls(pnl)}">${money(pnl)} <span style="opacity:.65">(${pct.toFixed(1)}%)</span></td>
    `;
    tbody.appendChild(tr);
  }

  tbody.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("change", () => {
      const p = state.positions.find(x => x.id === inp.dataset.id);
      const n = Number(String(inp.value).replace(/,/g, ""));
      if (!Number.isFinite(n)) return;
      p[inp.dataset.f] = n;
      save();
      render();
    });
  });

  const pnlEl = document.getElementById("pnl");
  pnlEl.textContent = money(totPnl);
  pnlEl.className = "val " + cls(totPnl);
  document.getElementById("pnlPct").textContent =
    (totCost ? ((totPnl / totCost) * 100).toFixed(1) : "0") + "% vs cost";
  document.getElementById("value").textContent = money(totVal);
  document.getElementById("cost").textContent = money(totCost);
  document.getElementById("asof").textContent =
    "USD · " + new Date().toLocaleString();
}

function reset() {
  state = structuredClone(SEED);
  save();
  render();
}

async function refresh() {
  try {
    const AI = "0x2E8c31162b855A2ffa90F6F8634643Ad6F111e18";
    const SFI = "0xb753428af26E81097e7fD17f40c88aaA3E04902c";
    const JUP = "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN";
    const [zecSpot, jupTok, kr, ds, dsSfi] = await Promise.all([
      fetch("https://api.coinbase.com/v2/prices/ZEC-USD/spot").then(r => r.json()),
      fetch("https://lite-api.jup.ag/tokens/v2/search?query=" + JUP).then(r => r.json()),
      fetch("https://api.kraken.com/0/public/Ticker?pair=DRVUSD").then(r => r.json()),
      fetch("https://api.dexscreener.com/latest/dex/tokens/" + AI).then(r => r.json()),
      fetch("https://api.dexscreener.com/latest/dex/tokens/" + SFI).then(r => r.json()),
    ]);
    let zcat = null;
    try {
      const zj = await fetch("https://lite-api.jup.ag/tokens/v2/search?query=HcRLc9VDgjLeK154xDawfb1dmVJ98DoSqcwTHGqiDeJR").then(r => r.json());
      zcat = (zj || []).find(t => t.id === "HcRLc9VDgjLeK154xDawfb1dmVJ98DoSqcwTHGqiDeJR")?.usdPrice;
    } catch {}
    const zec = Number(zecSpot?.data?.amount);
    const jup = (jupTok || []).find(t => t.id === JUP)?.usdPrice;
    const drv = Number(kr?.result?.DRVUSD?.c?.[0]);
    const ai = Number((ds?.pairs || [])[0]?.priceUsd);
    const sfi = Number((dsSfi?.pairs || [])[0]?.priceUsd);
    for (const p of state.positions) {
      if (p.id === "zec" && zec) p.mark = zec;
      if (p.id === "zcat" && zcat) p.mark = zcat;
      if (p.id === "drv" && drv) p.mark = drv;
      if (p.id === "ai" && ai) p.mark = ai;
      if (p.id === "sfi" && sfi) p.mark = sfi;
      if (p.id === "jup" && jup) p.mark = jup;
    }
    save();
  } catch (e) {
    console.warn(e);
  }
  render();
}

refresh();
</script>
</body>
</html>
