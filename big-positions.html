<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Big positions</title>
<style>
  :root { --bg:#0a0a0a; --fg:#f2f2f2; --muted:#888; --line:#222; --up:#3dd68c; --down:#ff6b6b; --card:#121212; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:40px 20px 80px; }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size:13px; font-weight:500; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin:0 0 16px; }
  h2 { font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin:34px 0 10px; }
  a { color:#9ecbff; text-decoration:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; }
  .card .lbl { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .card .val { font-size:44px; font-weight:560; letter-spacing:-.03em; line-height:1.1; }
  .card .hint { color:var(--muted); font-size:12px; margin-top:6px; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:12px; font-weight:500; color:var(--muted); padding:0 8px 10px; border-bottom:1px solid var(--line); }
  th.r, td.r { text-align:right; }
  td { padding:14px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .name { font-weight:560; }
  .venue { color:var(--muted); font-size:12px; margin-top:2px; }
  .muted { color:var(--muted); }
  .tag { display:inline-block; font-size:10px; border:1px solid #333; border-radius:6px; padding:0 5px; margin-left:6px; color:var(--muted); vertical-align:middle; font-weight:400; }
  .stale { color:#e0b050; }
  .bar { height:4px; background:#1d1d1d; border-radius:2px; margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#3a6ea5; }
  .pct { width:110px; }
  details.w { border-bottom:1px solid var(--line); }
  details.w summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; padding:13px 8px; font-variant-numeric:tabular-nums; }
  details.w summary::-webkit-details-marker { display:none; }
  details.w summary .chev { display:inline-block; font-size:10px; color:var(--muted); transition:transform .15s; width:10px; }
  details.w[open] summary .chev { transform:rotate(90deg); }
  details.w summary .lab { flex:1; min-width:0; }
  details.w summary .v { font-weight:560; text-align:right; min-width:100px; }
  details.w summary .p { color:var(--muted); text-align:right; width:56px; font-size:13px; }
  details.w summary:hover { background:#0f0f0f; }
  details.w table { margin:0 0 10px 18px; width:calc(100% - 18px); }
  details.w td { padding:9px 8px; font-size:14px; border-bottom-color:#1a1a1a; }
  .foot { margin-top:24px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:12px; }
  button { background:transparent; border:1px solid #333; color:var(--fg); border-radius:8px; padding:6px 12px; font:inherit; font-size:12px; cursor:pointer; }
  button:hover { border-color:#555; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Big positions</h1>
  <div style="margin:-8px 0 18px;font-size:13px"><a href="./">← Portfolio</a></div>
  <div class="card"><div class="lbl">Valor total</div><div class="val" id="total">—</div><div class="hint" id="totalHint"></div></div>

  <h2>Por ativo</h2>
  <table>
    <thead><tr><th>Ativo</th><th class="r">Valor</th><th class="r pct">%</th></tr></thead>
    <tbody id="classRows"></tbody>
  </table>

  <h2>Por wallet</h2>
  <div id="wallets" style="border-top:1px solid var(--line)"></div>

  <div class="foot">
    <button onclick="refresh()">Atualizar preços</button>
    <span id="asof"></span>
  </div>
</div>
<script>
const DATA_URL = "./big_positions.json";
let DATA = null, PX = {}, PXSRC = {}, PMLIVE = {}, PMCASH = {};
const PM_CASH = { "pUSD": "0xC011a7E12a19f7B1f670d46F03B03f3342E82DFB", "USDC.e": "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174" };

function money(n, d = 2) {
  if (n == null || !Number.isFinite(n)) return "—";
  return (n < 0 ? "−" : "") + "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function big(n) { return n == null ? "—" : money(n, n >= 1000 ? 0 : 2); }
function cashAmt(h) { return (h.currency === "EUR" ? "€" : (h.currency || "") + " ") + h.qty.toLocaleString("en-US", { maximumFractionDigits: 0 }); }
function qty(n) { return n.toLocaleString("en-US", { maximumFractionDigits: n >= 1000 ? 2 : n >= 1 ? 4 : 6 }); }
function price(p) { return p == null ? "—" : money(p, p >= 100 ? 2 : p >= 1 ? 4 : 6); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// asset classes (by symbol; tokenized stocks = xStocks on Solana)
const STABLE = new Set(["USDC","USDT","DAI","USDS","USDE","PYUSD","USDG","SPUSDC","JLUSDC","SUSDS","SDAI","SUSDE","FDUSD","USD1"]);
const ETHS = new Set(["ETH","WETH","STETH","WSTETH","WEETH","RETH","CBETH"]);
const BTCS = new Set(["BTC","WBTC","CBBTC","TBTC"]);
function assetClass(h) {
  if (h.kind === "polymarket") return "Polymarket";
  if (h.kind === "lp") return "LP (Raydium/Orca)";
  if (h.kind === "cash") return `Cash (${h.currency || h.symbol})`;
  const s = String(h.symbol || "").toUpperCase();
  if (STABLE.has(s)) return "Stablecoins";
  if (BTCS.has(s)) return "BTC";
  if (ETHS.has(s)) return "ETH / stETH";
  if (h.chain === "Solana" && /^[A-Z]{1,6}x$/.test(h.symbol)) return "Ações tokenizadas";
  return "Outros";
}

async function loadData() {
  const r = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
  DATA = await r.json();
}
function allHoldings() {
  const out = [];
  for (const w of DATA.wallets) for (const h of w.holdings) out.push({ ...h, wallet: w });
  for (const m of DATA.manual || []) out.push({ ...m, chain: "manual", wallet: null });
  return out;
}
async function ethCall(to, data) {
  const r = await fetch("https://ethereum-rpc.publicnode.com", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_call", params: [{ to, data }, "latest"] }) }).then(r => r.json());
  return r.result;
}
async function fetchPrices() {
  const keys = [...new Set(allHoldings().filter(h => h.kind !== "polymarket").flatMap(h => h.kind === "lp" ? h.underlying.map(u => u.priceKey) : [h.priceKey]))];
  PX = {}; PXSRC = {};
  // Polymarket: live positions from the public Data API (cash stays at the snapshot balance)
  for (const h of allHoldings().filter(h => h.kind === "polymarket")) {
    try {
      const d = await fetch(`https://data-api.polymarket.com/positions?user=${h.proxy}&sizeThreshold=0&limit=500`).then(r => r.json());
      if (Array.isArray(d)) PMLIVE[h.proxy] = d.filter(p => p.size > 0 && p.currentValue > 0)
        .map(p => ({ title: p.title, outcome: p.outcome, size: p.size, avgPrice: p.avgPrice, curPrice: p.curPrice, value: p.currentValue, pnl: p.cashPnl, endDate: p.endDate, slug: p.eventSlug || p.slug, redeemable: p.redeemable }))
        .sort((a, b) => b.value - a.value);
    } catch (e) { console.warn("polymarket", e); }
    try {   // live cash in the proxy (pUSD + USDC.e, 6 decimals) so trades since the snapshot aren't double counted
      const syms = Object.keys(PM_CASH), pad = h.proxy.slice(2).toLowerCase().padStart(64, "0");
      const r = await fetch("https://polygon-bor-rpc.publicnode.com", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify(syms.map((s, i) => ({ jsonrpc: "2.0", id: i, method: "eth_call", params: [{ to: PM_CASH[s], data: "0x70a08231" + pad }, "latest"] }))) }).then(r => r.json());
      const c = {};
      for (const x of r) { if (!x.result) throw new Error("rpc"); const v = Number(BigInt(x.result)) / 1e6; if (v > 0) c[syms[x.id]] = v; }
      PMCASH[h.proxy] = c;
    } catch (e) { console.warn("polymarket cash", e); }
  }
  try {
    const d = await fetch("https://coins.llama.fi/prices/current/" + keys.filter(k => !k.startsWith("fx:")).join(",")).then(r => r.json());
    for (const [k, v] of Object.entries(d.coins || {})) if (v.price) { PX[k] = v.price; PXSRC[k] = "DefiLlama"; }
  } catch (e) { console.warn("llama", e); }
  // EUR/USD (live): Coinbase > Frankfurter (ECB) > open.er-api; else the stored rate in big_positions.json
  if (keys.includes("fx:EURUSD")) {
    const srcs = [["Coinbase", "https://api.coinbase.com/v2/exchange-rates?currency=EUR", d => d.data.rates.USD],
                  ["ECB (Frankfurter)", "https://api.frankfurter.dev/v1/latest?from=EUR&to=USD", d => d.rates.USD],
                  ["open.er-api", "https://open.er-api.com/v6/latest/EUR", d => d.rates.USD]];
    for (const [name, url, get] of srcs) {
      try { const v = Number(get(await fetch(url).then(r => r.json()))); if (v > 0.5 && v < 2) { PX["fx:EURUSD"] = v; PXSRC["fx:EURUSD"] = name; break; } } catch {}
    }
  }
  const missing = keys.filter(k => !PX[k]);
  const sol = missing.filter(k => k.startsWith("solana:")).map(k => k.slice(7));
  if (sol.length) {
    try {
      const j = await fetch("https://lite-api.jup.ag/price/v3?ids=" + sol.join(",")).then(r => r.json());
      for (const m of sol) if (j[m]?.usdPrice) { PX["solana:" + m] = j[m].usdPrice; PXSRC["solana:" + m] = "Jupiter"; }
    } catch (e) { console.warn("jup", e); }
  }
  const cb = { "coingecko:bitcoin": "BTC", "coingecko:ethereum": "ETH", "coingecko:solana": "SOL" };
  for (const [k, s] of Object.entries(cb)) {
    if (keys.includes(k) && !PX[k]) {
      try { const r = await fetch(`https://api.coinbase.com/v2/prices/${s}-USD/spot`).then(r => r.json()); const p = Number(r?.data?.amount); if (p) { PX[k] = p; PXSRC[k] = "Coinbase"; } } catch {}
    }
  }
  const st = "ethereum:0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84";
  if (keys.includes(st) && !PX[st] && PX["coingecko:ethereum"]) { PX[st] = PX["coingecko:ethereum"]; PXSRC[st] = "≈ETH"; }
  // ERC-4626 savings vaults on Ethereum (stable underlying ≈ $1): convertToAssets(1 share)
  const vaults = { "0x28B3a8fb53B741A8Fd78c0fb9A6B2393d896a43d": 6, "0xa3931d71877C0E7a3148CB7Eb4463524FEc27fbD": 18,
                   "0x83F20F44975D03b1b09e64809B757c47f942BEeA": 18, "0x9D39A5DE30e57443BfF2A8307A4256c8797A3497": 18 };
  for (const [a, dec] of Object.entries(vaults)) {
    const k = "ethereum:" + a;
    if (!keys.includes(k) || PX[k]) continue;
    try {
      const one = 10n ** BigInt(dec);
      const v = Number(BigInt(await ethCall(a, "0x07a2d13a" + one.toString(16).padStart(64, "0"))) * 1000000n / one) / 1e6;
      if (v) { PX[k] = v; PXSRC[k] = "vault rate"; }
    } catch {}
  }
}
function pmRows(h) {   // Polymarket block: header + one row per open position + cash
  const sub = "padding-left:22px;font-size:13px";
  const pnl = v => `<span style="color:var(${v >= 0 ? "--up" : "--down"})">${v >= 0 ? "+" : "−"}${money(Math.abs(v))}</span>`;
  let html = `<tr><td><span class="name">Polymarket</span> <span class="tag">Polygon</span> <span class="muted" style="font-size:12px">${h._pos.length} posições · proxy <a href="https://polymarket.com/profile/${esc(h.proxy)}" target="_blank" rel="noopener">${esc(h.proxy.slice(0, 6) + "…" + h.proxy.slice(-4))}</a></span></td>` +
             `<td class="r muted" colspan="2" style="font-size:12px">${h._live ? "ao vivo" : "snapshot"}</td><td class="r name${h._live ? "" : " stale"}">${big(h._v)}</td></tr>`;
  for (const p of h._pos)
    html += `<tr><td style="${sub}">${esc(p.title)}<div class="venue">${esc(p.outcome)}${p.redeemable ? " · resolvido (por resgatar)" : p.endDate ? " · fim " + esc(p.endDate) : ""}</div></td>` +
            `<td class="r" style="font-size:13px">${qty(p.size)}</td><td class="r muted" style="font-size:12px">${p.avgPrice.toFixed(3)} → ${p.curPrice.toFixed(3)}</td>` +
            `<td class="r" style="font-size:13px">${money(p.value)}<div class="venue">${pnl(p.pnl)}</div></td></tr>`;
  for (const [sym, q] of Object.entries(h._cash || {}))
    html += `<tr><td style="${sub}">Cash <span class="muted" style="font-size:12px">${esc(sym)}</span></td><td class="r" style="font-size:13px">${qty(q)}</td><td></td><td class="r" style="font-size:13px">${money(q)}</td></tr>`;
  return html;
}
function lpValue(h) {   // LP = underlying token amounts x live prices (snapshot price per token as fallback)
  let v = 0, live = true;
  for (const u of h.underlying || []) {
    const p = PX[u.priceKey] ?? u.price;
    if (!PX[u.priceKey]) live = false;
    v += p ? u.qty * p : 0;
  }
  return { v, live };
}
function priceOf(h) {
  if (PX[h.priceKey]) return { p: PX[h.priceKey], live: true };
  return { p: h.price, live: false };   // snapshot from big_positions.json
}
function render() {
  const hs = allHoldings();
  let total = 0, stale = 0;
  for (const h of hs) {
    if (h.kind === "polymarket") {
      h._pos = PMLIVE[h.proxy] || h.positions; h._live = !!PMLIVE[h.proxy]; h._p = null;
      h._cash = PMCASH[h.proxy] || h.cash || {};
      h._live = h._live && !!PMCASH[h.proxy];
      h._v = h._pos.reduce((s, p) => s + p.value, 0) + Object.values(h._cash).reduce((s, v) => s + v, 0);
    }
    else if (h.kind === "lp") { const r = lpValue(h); h._p = null; h._live = r.live; h._v = r.v; }
    else { const { p, live } = priceOf(h); h._p = p; h._live = live; h._v = p ? h.qty * p : null; }
    if (!h._live && h._v) stale++;
    total += h._v || 0;
  }
  const pct = v => total ? (v / total * 100).toFixed(1) + "%" : "—";
  const man = (DATA.manual || []).map(m => m.kind === "cash" ? cashAmt(m) : `${qty(m.qty)} ${m.symbol}`);
  document.getElementById("total").textContent = big(total);
  document.getElementById("totalHint").textContent =
    `${DATA.wallets.length} wallets` + (man.length ? ` + ${man.join(" + ")} manual` : "") + ` · saldos de ${new Date(DATA.updated).toLocaleString("pt-PT")}`;

  // by asset class
  const cls = {};
  for (const h of hs) {
    const c = cls[assetClass(h)] ||= { v: 0, syms: {}, npos: 0 };
    c.v += h._v || 0;
    if (h.kind === "lp") c.npos += h.qty;
    if (h.kind === "polymarket") { c.pm = (c.pm || 0) + h._pos.length; c.syms = { [`${c.pm} posições + cash`]: 1 }; continue; }
    c.syms[h.symbol] = (c.syms[h.symbol] || 0) + (h._v || 0);
  }
  document.getElementById("classRows").innerHTML = Object.entries(cls).sort((a, b) => b[1].v - a[1].v).map(([name, c]) =>
    `<tr><td><span class="name">${esc(name)}</span><div class="venue">${c.npos ? `${c.npos} posições · ` : ""}${Object.entries(c.syms).sort((a, b) => b[1] - a[1]).map(([s]) => esc(s)).join(" · ")}</div></td>` +
    `<td class="r name">${big(c.v)}</td><td class="r pct muted">${pct(c.v)}<div class="bar"><i style="width:${total ? c.v / total * 100 : 0}%"></i></div></td></tr>`).join("");

  // by wallet (collapsed)
  const openIds = new Set([...document.querySelectorAll("details.w[open]")].map(d => d.dataset.id));
  const groups = DATA.wallets.map(w => ({ id: w.id, w, hs: hs.filter(h => h.wallet === w) }));
  for (const h of hs.filter(h => !h.wallet)) groups.push({ id: h.id || h.symbol, w: null, m: h, hs: [h] });
  for (const g of groups) g.v = g.hs.reduce((s, h) => s + (h._v || 0), 0);
  groups.sort((a, b) => b.v - a.v);
  document.getElementById("wallets").innerHTML = groups.map(({ id, w, m, hs: g, v }) => {
    const lab = w ? `<span class="name" title="${esc(w.address)}${w.note ? " · " + esc(w.note) : ""}">${esc(w.label)}</span><span class="tag">${esc(w.chain)}</span>` +
                    (w.error ? `<span class="tag stale" title="${esc(w.error)}">saldos antigos</span>` : "")
                  : m.kind === "cash" ? `<span class="name">${esc(m.name)}</span><span class="tag">manual · ${esc(m.currency)}</span> <span class="muted" style="font-size:13px">${cashAmt(m)}</span>`
                  : `<span class="name">${esc(m.symbol)}</span><span class="tag">manual</span>`;
    const body = g.length ? `<table>${g.sort((a, b) => (b._v || 0) - (a._v || 0)).map(h => h.kind === "polymarket" ? pmRows(h) : h.kind === "lp" ?
        `<tr><td><span class="name">${esc(h.symbol)}</span> <span class="tag">LP</span> <span class="muted" style="font-size:12px">${esc(h.name)} · ${h.qty} ${h.qty === 1 ? "posição" : "posições"}</span></td>` +
        `<td class="r muted" colspan="2" style="font-size:12px">${h.underlying.map(u => `${qty(u.qty)} ${esc(u.symbol)}`).join(" + ")}</td>` +
        `<td class="r${h._live ? "" : " stale"}">${big(h._v)}</td></tr>` :
        `<tr><td><span class="name">${esc(h.symbol)}</span> <span class="muted" style="font-size:12px">${h.wallet ? esc(h.chain) : h.kind === "cash" ? "fiat" : "off-chain"}</span></td>` +
        `<td class="r">${h.kind === "cash" ? cashAmt(h) : qty(h.qty)}</td><td class="r${h._live ? "" : " stale"}" title="${h._live ? esc(PXSRC[h.priceKey]) : "snapshot"}">${price(h._p)}</td><td class="r">${big(h._v)}</td></tr>`).join("")}</table>` +
        (w ? `<div style="margin:0 0 12px 26px;font-size:12px"><a href="${esc(w.explorer)}" target="_blank" rel="noopener">ver no explorer ↗</a></div>` : "")
      : `<div class="muted" style="margin:0 0 12px 26px;font-size:12px">vazia (nada acima de $${DATA.threshold_usd})</div>`;
    return `<details class="w" data-id="${esc(id)}"${openIds.has(id) ? " open" : ""}><summary><span class="chev">▶</span><span class="lab">${lab}</span>` +
           `<span class="v">${big(v)}</span><span class="p">${pct(v)}</span></summary>${body}</details>`;
  }).join("");
  document.getElementById("asof").textContent = `Preços ao vivo ${new Date().toLocaleTimeString("pt-PT")}` + (stale ? ` · ${stale} com preço snapshot` : "") + ` · limite $${DATA.threshold_usd}`;
}
async function refresh() {
  if (!DATA) await loadData(); else { try { await loadData(); } catch {} }
  render();
  await fetchPrices();
  render();
}
refresh();
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
